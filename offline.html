<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#3B2F2A"
  >

  <title>
    Education Finance — Offline
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      display: grid;
      place-items: center;

      background: #F7F3EC;
      color: #211D1A;

      font-family:
        system-ui,
        sans-serif;
    }

    .card {
      width: min(100%, 440px);
      padding: 28px;

      border: 1px solid #E7DED4;
      border-radius: 24px;

      background: #FFFFFF;

      text-align: center;
    }

    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: #3B2F2A;
      color: #F7EED8;

      font-weight: 800;
    }

    h1 {
      margin: 0;

      font-size: 22px;
    }

    p {
      margin: 10px 0 0;

      color: #746B64;

      font-size: 13px;
      line-height: 1.65;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="mark">
      EF
    </div>

    <h1>
      Sedang offline
    </h1>

    <p>
      Koneksi internet diperlukan untuk login dan membaca data terbaru.
      Coba buka kembali saat perangkat sudah terhubung.
    </p>

  </main>

</body>
</html>
